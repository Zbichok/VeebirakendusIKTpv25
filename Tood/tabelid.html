<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Tabelid</title>
    <link rel="stylesheet" href="TabelStyle.css">
    <link rel="stylesheet" href="liquidStyle.css">

</head>
<body>
<h1>Tabelid</h1>
<h2>Lihtnetabel</h2>
<table id="lihtnetabel">
    <tr>
        <td>A</td>
        <td>B</td>
    </tr>
    <tr>
        <td>C</td>
        <td>D</td>
    </tr>
</table>

<h2>Tabel kus on ühendatud lahtrid</h2>
<table id="keeruline1">
    <tr>
        <td colspan="2">A</td>
    </tr>
    <tr>
        <td>C</td>
        <td>D</td>
    </tr>
</table>
<h2>vell uks tabel kus on uhendatud lahtrid</h2>
<table id="keeruline2">
    <tr>
        <td rowspan="2" class="nimia">A</td>
        <td>B</td>
    </tr>
    <tr>
        <td>D</td>
    </tr>
</table>
<h1>Lipud</h1>
<table id="eesti">
    <caption>Eesti lipp</caption>
    <tr>
        <td></td>
    </tr>
    <tr>
    </tr>
    <tr>
        <td></td>
    </tr>
    <tr>
        <td></td>
    </tr>
</table>
</body>
</html>
