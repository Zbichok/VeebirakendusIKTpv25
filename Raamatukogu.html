<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Raamatukogu</title>
</head>
<body>

<h1>Raamatukogu</h1>

<!-- Otsingu väli ja nupp -->
<input type="text" id="autoriSisend" placeholder="Sisesta autori nimi">
<button id="otsiNupp">Otsi autorit</button>

<pre id="valjund"></pre>

<script>
    let vanaLog = console.log;
    console.log = function(tekst) {
        document.getElementById("valjund").textContent += tekst + "\n";
        vanaLog(tekst);
    };
</script>

<script src="jk/SuntaksStruktuur.js"></script>

<script>
    // Nupuvajutus käivitab otsingu
    document.getElementById("otsiNupp").addEventListener("click", function () {
        let autor = document.getElementById("autoriSisend").value;

        // Tühjendab eelmise tulemuse
        document.getElementById("valjund").textContent = "";

        raamatukogu.otsiAutori(autor);
    });
</script>

</body>
</html>
